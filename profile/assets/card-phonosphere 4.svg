<style>.halo{transform-origin:110px 120px;animation:h 5s ease-in-out infinite}@keyframes h{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.8;transform:scale(1.05)}}.go{animation:g 2.4s ease-in-out infinite}@keyframes g{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;animation-fill-mode:forwards!important}}</style>
