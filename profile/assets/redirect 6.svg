<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="This repository draws the Canessa System Labs organization page. Open the organization page.">
<title>This repository draws the Canessa System Labs organization page. Open the organization page.</title>
<style>.go{animation:g 2.4s ease-in-out infinite}@keyframes g{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}.fill{opacity:0;animation:in .5s 1.3s forwards}.pt{opacity:0;animation:in .4s 1.6s forwards}@keyframes in{to{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;animation-fill-mode:forwards!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2125"/><stop offset="1" stop-color="#18191c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <radialGradient id="glow" cx=".82" cy=".1" r=".9"><stop offset="0" stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx=".1" cy="1" r=".7"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" rx="28" fill="url(#glow)"/>
<rect width="1200" height="360" rx="28" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="1199" height="359" rx="27.5" fill="none" stroke="rgba(255,255,255,0.13)"/>
<g transform="translate(72 72) scale(1.2)"><path class="draw" d="M10 10H18V46H54V54H10Z" fill="none" stroke="#f5f5f7" stroke-width="2.4" stroke-linejoin="miter" pathLength="1"/><path class="fill" d="M10 10H18V46H54V54H10Z" fill="#f5f5f7"/><rect class="pt" x="26" y="26" width="12" height="12" fill="#2dd4bf"/></g><text x="170" y="104" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="2.5">THIS REPOSITORY DRAWS THE ORGANIZATION PAGE</text><text x="170" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-1">Canessa System Labs lives one level up.</text><text x="170" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">Its profile/ folder renders the front page of github.com/Canessa-System-Labs.</text><text x="170" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0">There is no code here: the page, its showcases and every solution&#x27;s status are one click away.</text><g class="go"><rect x="170" y="258" width="304" height="50" rx="25" fill="url(#accent)"/><text x="194" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0c0d10" text-anchor="start" letter-spacing="0">Open the organization page  →</text></g>
</svg>
